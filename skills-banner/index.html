<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=640" />
    <title>Core Skills — Orbit Banner</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #070b16; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 640px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 640px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="640">
      <!-- Seamless 12s loop: skills orbiting the PK core -->
      <div id="orbit" data-composition-id="orbit" data-composition-src="compositions/orbit.html"
        data-start="0" data-duration="12" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="640"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
