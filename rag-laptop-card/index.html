<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>RAG Document Q&amp;A — Laptop Card</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #0A0630; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1200px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1200px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1200">
      <!-- Sign-in screen, lid opens (0–4.5s) -->
      <div id="login" data-composition-id="login" data-composition-src="compositions/login.html"
        data-start="0" data-duration="4.5" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1200"></div>
      <!-- Upload dialog (4.5–9.5s) -->
      <div id="upload" data-composition-id="upload" data-composition-src="compositions/upload.html"
        data-start="4.5" data-duration="5" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1200"></div>
      <!-- Chat answers from the PDF (9.5–16s) -->
      <div id="chat" data-composition-id="chat" data-composition-src="compositions/chat.html"
        data-start="9.5" data-duration="6.5" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1200"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
