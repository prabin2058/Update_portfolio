<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>Digital Hajir — Scan Card</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #030712; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1200px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1200px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1200">
      <!-- One continuous shot: screens scanned in, face recognition, 2x2 grid (0–16s) -->
      <div id="scan" data-composition-id="scan" data-composition-src="compositions/scan.html"
        data-start="0" data-duration="16" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1200"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
