  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#glow-cyan", { x: 0 }, { x: -220, duration: 16, ease: "none" }, 0);
    tl.fromTo("#glow-indigo", { x: 0 }, { x: 240, duration: 16, ease: "none" }, 0);

    // Brackets lock on: start wide, snap to the viewport corners.
    tl.fromTo("#br-tl", { x: -90, y: -70 }, { x: 0, y: 0, duration: 0.6, ease: "back.out(2)" }, 0);
    tl.fromTo("#br-tr", { x: 90, y: -70 }, { x: 0, y: 0, duration: 0.6, ease: "back.out(2)" }, 0);
    tl.fromTo("#br-bl", { x: -90, y: 70 }, { x: 0, y: 0, duration: 0.6, ease: "back.out(2)" }, 0);
    tl.fromTo("#br-br", { x: 90, y: 70 }, { x: 0, y: 0, duration: 0.6, ease: "back.out(2)" }, 0);

    // A scan: line sweeps top to bottom, revealing the layer behind it; brackets give a small pulse.
    function scan(layer, at, dur) {
      tl.fromTo(layer, { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: dur, ease: "power1.inOut", immediateRender: false }, at);
      tl.fromTo("#scanline", { y: 0, opacity: 1 }, { y: 788, duration: dur, ease: "power1.inOut", immediateRender: false }, at);
      tl.fromTo("#scanwash", { y: 0, opacity: 1 }, { y: 788, duration: dur, ease: "power1.inOut", immediateRender: false }, at);
      tl.to(["#scanline", "#scanwash"], { opacity: 0, duration: 0.15 }, at + dur);
      tl.to(["#br-tl", "#br-br"], { scale: 1.12, duration: 0.15, yoyo: true, repeat: 1, ease: "power1.out" }, at + dur);
      tl.to(["#br-tr", "#br-bl"], { scale: 1.12, duration: 0.15, yoyo: true, repeat: 1, ease: "power1.out" }, at + dur);
    }
    // Pointer glides to (x, y) inside the viewport and clicks.
    function click(at, x, y) {
      tl.to("#cursor", { x: x, y: y, duration: 0.9, ease: "power2.inOut" }, at);
      tl.to("#cursor", { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "0 0" }, at + 0.95);
      tl.fromTo("#click", { x: x, y: y, scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, at + 0.95);
      tl.to("#click", { scale: 1.5, opacity: 0, duration: 0.4, ease: "power2.out" }, at + 1.12);
    }

    // 0–3.6s: home page scanned in (already 45% down at frame 0); pointer clicks "Admin Login" (1087, 38).

    tl.fromTo("#scanline", { y: 355, opacity: 1 }, { y: 788, duration: 0.8, ease: "power1.out" }, 0);
    tl.fromTo("#scanwash", { y: 355, opacity: 1 }, { y: 788, duration: 0.8, ease: "power1.out" }, 0);
    tl.to(["#scanline", "#scanwash"], { opacity: 0, duration: 0.15 }, 0.8);
    tl.fromTo("#cursor", { x: 760, y: 560, opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.5);
    click(1.6, 1087, 38);

    // 3.6–6.6s: admin login scanned in; pointer clicks "Login as Admin" (720, 495).
    scan("#layer-admin", 3.4, 0.9);
    click(4.6, 720, 495);

    // 6.6–9.6s: dashboard scanned in; pointer clicks "Take Attendance" (216, 316).
    scan("#layer-dash", 6.5, 0.9);
    click(7.7, 216, 316);

    // 9.4–13s: live face recognition scanned in; pointer leaves, camera pushes in on the recognised face, then eases back.
    scan("#layer-face", 9.4, 0.9);
    tl.to("#cursor", { opacity: 0, duration: 0.25 }, 9.3);
    tl.fromTo("#zoom", { scale: 1 }, { scale: 1.7, duration: 1.4, ease: "power3.inOut", transformOrigin: "695px 360px", immediateRender: false }, 10.5);
    tl.to("#zoom", { scale: 1, duration: 1.0, ease: "power2.inOut" }, 12.2);

    // 13–16s: viewport steps back and the four screens settle into a 2x2 grid.
    tl.to("#viewport", { opacity: 0, scale: 0.96, duration: 0.5, ease: "power2.in" }, 13.1);
    tl.fromTo("#tile-1", { opacity: 0, scale: 0.85, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" }, 13.35);
    tl.fromTo("#tile-2", { opacity: 0, scale: 0.85, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" }, 13.5);
    tl.fromTo("#tile-3", { opacity: 0, scale: 0.85, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" }, 13.65);
    tl.fromTo("#tile-4", { opacity: 0, scale: 0.85, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" }, 13.8);
    tl.to(["#br-tl", "#br-tr", "#br-bl", "#br-br"], { scale: 1.06, duration: 1.4, ease: "sine.inOut" }, 14.4);

    window.__timelines["scan"] = tl;
  </script>
