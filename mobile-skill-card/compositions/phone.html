    const depth = { "#card-welcome": [140, 16], "#card-ai": [120, -16], "#card-astro": [200, -22],

    // Phone sways gently; the dashboard scrolls down and back. Both return to the start at 12s.

    // Each item bobs on its own period (4, 6 or 12 s all divide the loop, so it joins seamlessly).

      const s = flip ? -1 : 1;
      tl.fromTo(id, { y: -amp * s, rotation: -rot * s }, { y: amp * s, rotation: rot * s, duration: period / 2, ease: "sine.inOut",
