<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>QR Branding — Laptop Card</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #030705; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1200px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1200px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1920" data-height="1200">
      <!-- Sign-in screen, lid opens (0–4.5s) -->
      <div id="login" data-composition-id="login" data-composition-src="compositions/login.html"
        data-start="0" data-duration="4.5" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1200"></div>
      <!-- Dashboard (4.5–8.5s) -->
      <div id="dashboard" data-composition-id="dashboard" data-composition-src="compositions/dashboard.html"
        data-start="4.5" data-duration="4" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1200"></div>
      <!-- Add product form (8.5–12.5s) -->
      <div id="add-product" data-composition-id="add-product" data-composition-src="compositions/add-product.html"
        data-start="8.5" data-duration="4" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1200"></div>
      <!-- Generated QR code (12.5–18s) -->
      <div id="qr" data-composition-id="qr" data-composition-src="compositions/qr.html"
        data-start="12.5" data-duration="5.5" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1200"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
